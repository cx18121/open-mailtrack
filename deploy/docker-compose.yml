services:
  server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?set API_KEY in deploy/.env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8787:8787"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # Hosts running systemd-resolved hand containers a 127.0.0.53 resolver that cannot be reached from inside.
    dns: [1.1.1.1, 1.0.0.1]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - server

volumes:
  data:
